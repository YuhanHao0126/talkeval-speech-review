<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" rx="24" fill="#fcfaff"/><g font-family="KaiTi,STKaiti,serif"><text x="42" y="46" font-family="Segoe UI,sans-serif" font-size="15" letter-spacing="4" fill="#b5a5c6">TALKEVAL++ / POINT MAP</text><path d="M600 380C406 380,406 183,406 183" stroke="#aa8bce" stroke-width="3" fill="none" opacity=".5"/><g transform="translate(36,83)"><rect width="370" height="234" rx="16" fill="white" stroke="#aa8bce" stroke-width="1.5"/><rect x="15" y="16" width="92" height="24" rx="12" fill="#f4effd"/><text x="61" y="33" fill="#73518f" font-size="13" text-anchor="middle" font-family="Segoe UI,sans-serif">POINT 01</text><text x="19" y="80" fill="#73518f" font-size="26" font-weight="bold"><tspan x="19" dy="0">皮肤也感受着生活</tspan></text><text x="19" y="120" fill="#9582a4" font-size="20" font-weight="normal"><tspan x="19" dy="0">睡眠、饮食、心情与环境，都可能影响</tspan><tspan x="19" dy="29">皮肤健康。</tspan></text><path d="M21 211Q170 207 346 211" stroke="#aa8bce" stroke-width="5" fill="none" opacity=".25"/></g><path d="M600 380C406 380,406 538,406 538" stroke="#72af99" stroke-width="3" fill="none" opacity=".5"/><g transform="translate(36,438)"><rect width="370" height="234" rx="16" fill="white" stroke="#72af99" stroke-width="1.5"/><rect x="15" y="16" width="92" height="24" rx="12" fill="#eaf6f1"/><text x="61" y="33" fill="#3f7b65" font-size="13" text-anchor="middle" font-family="Segoe UI,sans-serif">POINT 02</text><text x="19" y="80" fill="#3f7b65" font-size="26" font-weight="bold"><tspan x="19" dy="0">用实验检验假说</tspan></text><text x="19" y="120" fill="#9582a4" font-size="20" font-weight="normal"><tspan x="19" dy="0">阻断小鼠压力激素分泌，再施加压力，</tspan><tspan x="19" dy="29">观察是否出现白发。</tspan></text><path d="M21 211Q170 207 346 211" stroke="#72af99" stroke-width="5" fill="none" opacity=".25"/></g><path d="M600 380C794 380,794 183,794 183" stroke="#d1b16d" stroke-width="3" fill="none" opacity=".5"/><g transform="translate(794,83)"><rect width="370" height="234" rx="16" fill="white" stroke="#d1b16d" stroke-width="1.5"/><rect x="15" y="16" width="92" height="24" rx="12" fill="#fff5df"/><text x="61" y="33" fill="#9b7a35" font-size="13" text-anchor="middle" font-family="Segoe UI,sans-serif">POINT 03</text><text x="19" y="80" fill="#9b7a35" font-size="26" font-weight="bold"><tspan x="19" dy="0">结果，推翻了预想</tspan></text><text x="19" y="120" fill="#9582a4" font-size="20" font-weight="normal"><tspan x="19" dy="0">研究结果没有支持此前关于精神压力与</tspan><tspan x="19" dy="29">白发的两种假说。</tspan></text><path d="M21 211Q170 207 346 211" stroke="#d1b16d" stroke-width="5" fill="none" opacity=".25"/></g><path d="M600 380C794 380,794 538,794 538" stroke="#cf98a5" stroke-width="3" fill="none" opacity=".5"/><g transform="translate(794,438)"><rect width="370" height="234" rx="16" fill="white" stroke="#cf98a5" stroke-width="1.5"/><rect x="15" y="16" width="92" height="24" rx="12" fill="#fceef0"/><text x="61" y="33" fill="#a36178" font-size="13" text-anchor="middle" font-family="Segoe UI,sans-serif">POINT 04</text><text x="19" y="80" fill="#a36178" font-size="26" font-weight="bold"><tspan x="19" dy="0">追问背后的机制</tspan></text><text x="19" y="120" fill="#9582a4" font-size="20" font-weight="normal"><tspan x="19" dy="0">研究希望理解白发形成机制，最终帮助</tspan><tspan x="19" dy="29">人们保持乌黑头发。</tspan></text><path d="M21 211Q170 207 346 211" stroke="#cf98a5" stroke-width="5" fill="none" opacity=".25"/></g><rect x="464" y="307" width="272" height="146" rx="28" fill="#ece3fa" stroke="#cab3e1"/><text x="600" y="335" text-anchor="middle" font-size="13" fill="#ad91c2" font-family="Segoe UI,sans-serif">SPEECH / 核心观点</text><text x="600" y="368" text-anchor="middle" font-size="24" fill="#816293">压力和白发</text><text x="600" y="734" text-anchor="middle" font-size="16" fill="#b9a5c9">四个观点，一眼看见表达结构 · 点击分支回看对应片段</text></g></svg>